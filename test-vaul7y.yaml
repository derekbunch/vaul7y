# Local test config for vaul7y. Replace the Vault values before running.
vault_addr: https://your-vault.example.com
vault_token: hvs.your-token
vault_namespace: admin

# Secret path to start in when vaul7y opens.
vaulty_default_path: secret/team/data-engineering

theme:
  background: "#1d2021"
  highlight_primary: "#e78a4e"
  highlight_secondary: "#a9b665"
  standard: "#d4be98"
  active: "#3c3836"
  white: "#f2e5bc"
  light_grey: "#928374"
  modal_info: "#d3869b"
  attention: "#ea6962"
